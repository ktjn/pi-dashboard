name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      - uses: astral-sh/setup-uv@v10

      - run: uv run --project system-spec/reference-implementation python system-spec/reference-implementation/metamodel.py spec.yaml --stage verification

  release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2

      - run: cargo install cross --locked

      - run: cross build --release --target aarch64-unknown-linux-gnu -p dashboard-pi

      - run: |
          mkdir -p bundle
          cp target/aarch64-unknown-linux-gnu/release/dashboard-pi bundle/
          cp board.toml bundle/
          tar -czf pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz -C bundle .

      - run: sha256sum pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz > pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz.sha256
