name: CI

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo run -p dashboard-core --bin validate_board_config -- board.toml

      - run: cargo build --workspace --all-targets

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - run: cargo run -p dashboard-core --bin validate_board_config -- board.toml

      - run: cargo install cross --locked

      - run: cross build --release --target aarch64-unknown-linux-gnu -p dashboard-pi

      - run: |
          mkdir -p bundle
          cp target/aarch64-unknown-linux-gnu/release/dashboard-pi bundle/
          cp board.toml bundle/
          tar -czf pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz -C bundle .

      - run: sha256sum pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz > pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz.sha256

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            pi-dashboard-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz.sha256
