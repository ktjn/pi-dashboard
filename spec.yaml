risks:
  - { id: risk-macroquad-wayland-fullscreen, target: dashboard-core, description: "Macroquad/GLFW fullscreen under Wayland is known to cap at ~30fps or panic on some miniquad backend configs; unconfirmed on this hardware.", treatment: mitigation, mitigated_by: [req-performance-framerate] }
  - { id: risk-wlr-randr-env-fragility, target: schedule-display-power, description: "wlr-randr backlight control silently fails without the correct WAYLAND_DISPLAY/XDG_RUNTIME_DIR when invoked from a non-interactive systemd context.", treatment: mitigation, mitigated_by: [req-resilience-backlight] }
  - { id: risk-highlightly-tos-unverified, target: show-standings, description: "Highlightly Football API's attribution/commercial-use terms were not independently verified before selecting it for the free Allsvenskan adapter.", treatment: acceptance, residual_accepted: true }
  - { id: risk-scalability-not-applicable, target: pi-dashboard, description: "Single personal device, single viewer, no load-scaling obligation; scalability narrowed out of verification_categories for this reason.", treatment: acceptance, residual_accepted: true }
